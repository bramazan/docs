# Container-ici nginx — mint export statik sitesini servis eder.
# Dis (reverse-proxy) nginx TLS/host yonlendirmesini yapar; burasi sadece dosya sunar.
# Export yerlesimi: her sayfa <path>/index.html (orn. documentation/concepts/amounts/index.html).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Next.js asset'leri content-hash'li — agresif cache guvenli.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
